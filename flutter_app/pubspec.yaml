name: tinkerpro_support_flutter
description: "TinkerPro Support companion app"
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.2

  shared_preferences: ^2.3.2

  package_info_plus: ^8.0.0

  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3

  flutter_local_notifications: ^18.0.1

  google_fonts: ^6.2.1

  url_launcher: ^6.3.1

  web_socket_channel: ^3.0.0

  image_picker: ^1.1.2
  mobile_scanner: ^7.0.0
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  google_sign_in: ^6.2.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  flutter_webrtc: ^0.12.0
  permission_handler: ^11.3.1

  flutter_callkit_incoming: ^2.5.0

  audioplayers: ^6.1.0
  flutter_quill: ^11.6.0
  vsc_quill_delta_to_html: ^1.0.5
  html: ^0.15.7
  barcode_widget: ^2.0.4
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/tinkerpro-icon-512.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/tinkerpro-adaptive-fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
