name: Build Windows .exe (employee_app)

# Triggers:
#   - manual via the Actions tab in GitHub ("Run workflow" button)
#   - automatic on tags like v1.2.3 (handy for releases)
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'TPS_BASE_URL (chat backend)'
        required: true
        default: 'https://support.tinkerpro.io'
      soketi_host:
        description: 'CHAT_SOKETI_HOST (WebSocket host — usually same as base_url host)'
        required: true
        default: 'support.tinkerpro.io'
      tinker_chat_url:
        description: 'TINKER_CHAT_URL (AI assistant backend)'
        required: true
        default: 'https://tinker-chat.tinkerpro.cloud'
      pos_user:
        description: 'TPS_POS_USER (MariaDB user the /ticket form authenticates as). Defaults to root, matching production POS installs.'
        required: true
        default: 'root'
      pos_pass:
        description: 'TPS_POS_PASS (empty for XAMPP/TinkerPro POS defaults).'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Pin to the VS2022 image. `windows-latest` now redirects to
    # windows-2025-vs2026 (VS2026 / MSVC 14.51), which REMOVED
    # <experimental/coroutine> + the /await option that flutter_webrtc's
    # Windows native code still relies on — that breaks the build with
    # "error STL1011 / C2338". windows-2022 ships VS2022 (MSVC 14.4x) which
    # still supports it. Revisit when flutter_webrtc is upgraded to a build
    # that uses standard <coroutine>.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: employee_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions (debug)
        run: |
          flutter --version
          flutter doctor -v
        shell: pwsh

      - name: Resolve dependencies
        run: flutter pub get
        shell: pwsh

      - name: Build Windows release
        env:
          BASE_URL:        ${{ github.event.inputs.base_url        || 'https://support.tinkerpro.io' }}
          SOKETI_HOST:     ${{ github.event.inputs.soketi_host     || 'support.tinkerpro.io' }}
          TINKER_CHAT_URL: ${{ github.event.inputs.tinker_chat_url || 'https://tinker-chat.tinkerpro.cloud' }}
          POS_USER:        ${{ github.event.inputs.pos_user        || 'root' }}
          POS_PASS:        ${{ github.event.inputs.pos_pass        || '' }}
        run: |
          flutter build windows --release `
            --dart-define="TPS_BASE_URL=$env:BASE_URL" `
            --dart-define="CHAT_SOKETI_HOST=$env:SOKETI_HOST" `
            --dart-define="CHAT_SOKETI_PORT=443" `
            --dart-define="CHAT_SOKETI_TLS=true" `
            --dart-define="CHAT_SOKETI_PATH=/soketi" `
            --dart-define="CHAT_SOKETI_KEY=tinkerpro-chat-key" `
            --dart-define="TINKER_CHAT_URL=$env:TINKER_CHAT_URL" `
            --dart-define="TPS_POS_USER=$env:POS_USER" `
            --dart-define="TPS_POS_PASS=$env:POS_PASS" `
            --dart-define="RUSTDESK_RELAY_HOST=192.168.1.40" `
            --dart-define="RUSTDESK_RELAY_KEY=M5nva66QiMeNabC58GraFDPyMY5cKPNDKHgmPYA+b2c=" `
            --dart-define="RUSTDESK_PASSWORD_SALT=tinkerpro-2026-pepper"
        shell: pwsh

      - name: Stage the POS setup script next to TpSupport.exe
        # Ships with the .exe so a first-time install on a fresh XAMPP
        # POS box is one click: unzip → run setup-pos-and-run.ps1 →
        # done. Idempotent on re-run.
        run: |
          Copy-Item `
            -Path setup-pos-and-run.ps1 `
            -Destination build\windows\x64\runner\Release\setup-pos-and-run.ps1
        shell: pwsh

      - name: Zip the Release folder
        # Ship the WHOLE folder — the .exe alone won't run without
        # the DLLs and data\flutter_assets\ next to it.
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath TpSupport-windows-x64.zip
        shell: pwsh

      - name: Build installer with Inno Setup
        # windows-latest images ship Inno Setup 6 pre-installed at
        # "C:\Program Files (x86)\Inno Setup 6\ISCC.exe". Version is
        # parsed inline (avoids the UTF-16 GITHUB_OUTPUT footgun) and
        # passed via /D AppVersion=...
        env:
          POS_PASS: ${{ github.event.inputs.pos_pass || '' }}
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line
          $appVer = ($line -replace 'version:\s*', '').Trim().Split('+')[0]
          if ([string]::IsNullOrWhiteSpace($appVer)) { $appVer = '1.0.0' }
          Write-Host "Installer version: $appVer"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC not found at expected path; falling back to PATH"
            $iscc = "iscc.exe"
          }
          # Pass POS_PASS into iscc as /DPosPass=... so the installer's
          # [Code] hook can run setup-pos-and-run.ps1 with the same
          # password the .exe was compiled to send. Quoted-literal so
          # symbols (@ ! # etc.) survive intact through cmd parsing.
          & $iscc `
            "/Qp" `
            "/DAppVersion=$appVer" `
            "/DSourceDir=..\build\windows\x64\runner\Release" `
            "/DOutputDir=..\installer-out" `
            "/DPosPass=$env:POS_PASS" `
            installer\tinkerpro-employee.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer files produced:"
          Get-ChildItem installer-out
        shell: pwsh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: TpSupport-windows-x64
          path: employee_app/TpSupport-windows-x64.zip
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TpSupport-Setup
          path: employee_app/installer-out/*.exe
          retention-days: 14
