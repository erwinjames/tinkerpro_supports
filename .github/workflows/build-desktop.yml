name: Build desktop apps (support)

# Windows -> Tauri (WebView2/Chromium) .exe + .msi
# Linux   -> bare-WebKitGTK wrapper AppImage (support_webkit)
#
# Linux does NOT use Tauri: wry's IPC/custom-protocol layer maxes out
# WebKitGTK's connection pool and hangs the heavy remote dashboard
# (tauri-apps/tauri#8922). A plain WebKitWebView loads it fine, so Linux ships
# the support_webkit wrapper instead. Windows/WebView2 is unaffected.
#
# Triggers: manual, or tags like desktop-v1.2.3.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: support_tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: support_tauri/src-tauri
      - name: Install JS deps
        run: npm ci || npm install
        shell: bash
      - name: Build (Tauri)
        run: npx tauri build
        shell: bash
      - name: Collect installers
        run: |
          mkdir -p dist
          cp -v src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          cp -v src-tauri/target/release/bundle/msi/*.msi  dist/ 2>/dev/null || true
          ls -lh dist
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: support-windows
          path: support_tauri/dist/*
          retention-days: 14

  linux:
    # 22.04 = older glibc -> AppImage runs on a wider range of distros.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: support_webkit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: support_webkit
      - name: Install WebKitGTK + GTK dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            file \
            desktop-file-utils \
            libfuse2
        shell: bash
      - name: Build
        run: cargo build --release
        shell: bash
      - name: Package AppImage (thin — uses host WebKitGTK)
        # We intentionally do NOT bundle WebKitGTK: Fedora/most distros compute
        # the WebKit helper-process path relative to the lib, which breaks when
        # relocated into an AppImage. Instead the AppImage carries only the small
        # Rust binary and loads the host's system webkit2gtk-4.1 + gtk3 (present
        # on any modern Linux desktop, and the exact combo we verified works).
        run: |
          set -e
          WORK="$PWD/appimage-thin"
          rm -rf "$WORK"; mkdir -p "$WORK/AppDir/usr/bin" "$WORK/AppDir/usr/share/icons/hicolor/256x256/apps"
          cp target/release/tinkerpro-support "$WORK/AppDir/usr/bin/"
          cp assets/icon.png "$WORK/AppDir/tinkerpro-support.png"
          cp assets/icon.png "$WORK/AppDir/usr/share/icons/hicolor/256x256/apps/tinkerpro-support.png"
          cat > "$WORK/AppDir/tinkerpro-support.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TinkerPro Support
          Exec=tinkerpro-support
          Icon=tinkerpro-support
          Categories=Office;
          Terminal=false
          EOF
          cat > "$WORK/AppDir/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"
          exec "${HERE}/usr/bin/tinkerpro-support" "$@"
          EOF
          chmod +x "$WORK/AppDir/AppRun"
          cd "$WORK"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$WORK/AppDir" TinkerPro-Support-x86_64.AppImage
          mkdir -p "$PWD/../dist"
          mv -v ./*.AppImage "$PWD/../dist/TinkerPro-Support-x86_64.AppImage"
          ls -lh "$PWD/../dist"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: support-linux
          path: support_webkit/dist/*.AppImage
          retention-days: 14
