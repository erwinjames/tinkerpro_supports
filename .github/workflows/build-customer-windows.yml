name: Build Windows .exe (customer_app)

# Triggers:
#   - manual via the Actions tab in GitHub ("Run workflow" button)
#   - automatic on tags like v1.2.3 (handy for releases)
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'TPS_BASE_URL (chat backend)'
        required: true
        default: 'https://uninterrupted-brent-lunulate.ngrok-free.dev/tinkerpro_support'
      soketi_host:
        description: 'CHAT_SOKETI_HOST (WebSocket host — usually same as base_url host)'
        required: true
        default: 'uninterrupted-brent-lunulate.ngrok-free.dev'
  push:
    tags:
      - 'customer-v*'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: customer_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions (debug)
        run: |
          flutter --version
          flutter doctor -v
        shell: pwsh

      - name: Resolve dependencies
        run: flutter pub get
        shell: pwsh

      - name: Build Windows release
        # All defines are baked at compile time. POS DB defaults
        # (host/user/pass/db) are intentionally left empty/standard so
        # PosDiscoveryService runs the LAN sweep at install time —
        # works for both single-terminal (DB on the same Windows box)
        # and multi-terminal (DB on another box on the shop wifi).
        env:
          BASE_URL:    ${{ github.event.inputs.base_url    || 'https://uninterrupted-brent-lunulate.ngrok-free.dev/tinkerpro_support' }}
          SOKETI_HOST: ${{ github.event.inputs.soketi_host || 'uninterrupted-brent-lunulate.ngrok-free.dev' }}
        run: |
          flutter build windows --release `
            --dart-define="TPS_BASE_URL=$env:BASE_URL" `
            --dart-define="CHAT_SOKETI_HOST=$env:SOKETI_HOST" `
            --dart-define="CHAT_SOKETI_PORT=443" `
            --dart-define="CHAT_SOKETI_TLS=true" `
            --dart-define="CHAT_SOKETI_KEY=tinkerpro-chat-key"
        shell: pwsh

      - name: Zip the Release folder
        # Ship the WHOLE folder — the .exe alone won't run without
        # the DLLs and data\flutter_assets\ next to it.
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath TpCustomer-windows-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TpCustomer-windows-x64
          path: customer_app/TpCustomer-windows-x64.zip
          retention-days: 14
