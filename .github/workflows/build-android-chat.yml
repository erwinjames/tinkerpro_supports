name: Build Android APK (chat_app)

# Triggers:
#   - manual via the Actions tab ("Run workflow" button)
#   - automatic on tags like android-v1.2.3 (handy for releases)
#
# Produces a release APK. With no Android signing secrets configured the build
# falls back to debug signing — the APK still installs on a device for testing
# (just not Play-Store ready). Add the ANDROID_* secrets below to get a
# release-key-signed APK.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'TPS_BASE_URL (chat backend)'
        required: true
        default: 'https://support.tinkerpro.io'
      soketi_host:
        description: 'CHAT_SOKETI_HOST (WebSocket host — usually same as base_url host)'
        required: true
        default: 'support.tinkerpro.io'
  push:
    tags:
      - 'chat-android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_app

    env:
      # Shared dart-define set — kept in sync with the iOS/desktop builds so
      # realtime chat + calls hit the same Soketi endpoint (TLS on 443, /soketi
      # reverse-proxy prefix).
      DART_DEFINES: >-
        --dart-define=TPS_BASE_URL=${{ github.event.inputs.base_url || 'https://support.tinkerpro.io' }}
        --dart-define=CHAT_SOKETI_HOST=${{ github.event.inputs.soketi_host || 'support.tinkerpro.io' }}
        --dart-define=CHAT_SOKETI_PORT=443
        --dart-define=CHAT_SOKETI_TLS=true
        --dart-define=CHAT_SOKETI_PATH=/soketi
        --dart-define=CHAT_SOKETI_KEY=tinkerpro-chat-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions (debug)
        run: |
          flutter --version
          java -version

      - name: Resolve Dart dependencies
        run: flutter pub get

      # ── Optional release signing ─────────────────────────────────────────
      # Provide these repository secrets to sign with a real release key:
      #   ANDROID_KEYSTORE_BASE64   — base64 of your upload/release keystore
      #                               (base64 -w0 upload-keystore.jks)
      #   ANDROID_KEYSTORE_PASSWORD — store password
      #   ANDROID_KEY_PASSWORD      — key password
      #   ANDROID_KEY_ALIAS         — key alias
      # When present we write android/key.properties; the app's Gradle picks it
      # up if a signingConfig reads it. Without them the release build is
      # debug-signed (still installable for testing).
      - name: Detect signing secrets
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Android signing secrets → debug-signed release APK"
          fi

      - name: Write release keystore + key.properties
        if: steps.signing.outputs.signed == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo -n "$KS_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${KS_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          PROPS

      - name: Build release APK
        run: flutter build apk --release $DART_DEFINES

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinkerPro-Chat-android-apk
          path: chat_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
