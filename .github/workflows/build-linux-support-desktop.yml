name: Build Linux installer (support_desktop)

# Triggers:
#   - manual via the Actions tab ("Run workflow")
#   - automatic on tags like sd-v1.2.3 (shared with the Windows workflow)
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'TPS_BASE_URL (support backend)'
        required: true
        default: 'https://support.tinkerpro.io'
      soketi_host:
        description: 'CHAT_SOKETI_HOST (WebSocket host — usually the base_url host)'
        required: true
        default: 'support.tinkerpro.io'
  push:
    tags:
      - 'sd-v*'

jobs:
  build:
    # 22.04 = older glibc → the AppImage/tarball runs on a wider range of
    # distros than if we built on 24.04.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: support_desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libfuse2 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions (debug)
        run: |
          flutter --version
          flutter doctor -v
        shell: bash

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        shell: bash

      - name: Resolve dependencies
        run: flutter pub get
        shell: bash

      - name: Build Linux release
        env:
          BASE_URL:    ${{ github.event.inputs.base_url    || 'https://support.tinkerpro.io' }}
          SOKETI_HOST: ${{ github.event.inputs.soketi_host || 'support.tinkerpro.io' }}
        run: |
          flutter build linux --release \
            --dart-define="TPS_BASE_URL=$BASE_URL" \
            --dart-define="CHAT_SOKETI_HOST=$SOKETI_HOST" \
            --dart-define="CHAT_SOKETI_PORT=443" \
            --dart-define="CHAT_SOKETI_TLS=true" \
            --dart-define="CHAT_SOKETI_PATH=/soketi" \
            --dart-define="CHAT_SOKETI_KEY=tinkerpro-chat-key"
        shell: bash

      - name: Parse app version
        id: ver
        run: |
          appVer=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:\s*//' | cut -d'+' -f1 | tr -d '[:space:]')
          [ -z "$appVer" ] && appVer=1.0.0
          echo "appVer=$appVer" >> "$GITHUB_OUTPUT"
          echo "App version: $appVer"
        shell: bash

      - name: Package portable tarball
        run: |
          BUNDLE=build/linux/x64/release/bundle
          OUT="support_desktop-linux-x64-${{ steps.ver.outputs.appVer }}.tar.gz"
          tar -C "$BUNDLE" -czf "$OUT" .
          echo "Built $OUT"
          ls -lh "$OUT"
        shell: bash

      - name: Build AppImage
        run: |
          set -e
          BUNDLE="$PWD/build/linux/x64/release/bundle"
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          # Flutter's exe needs lib/ + data/ beside it — copy the whole bundle.
          cp -r "$BUNDLE"/. "$APPDIR/usr/bin/"

          # Desktop entry (root + the standard applications path).
          cat > "$APPDIR/support_desktop.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TinkerPro Support Console
          Comment=TinkerPro Support — Control Suite
          Exec=support_desktop
          Icon=support_desktop
          Categories=Utility;Office;
          Terminal=false
          EOF
          mkdir -p "$APPDIR/usr/share/applications"
          cp "$APPDIR/support_desktop.desktop" "$APPDIR/usr/share/applications/"

          # Icon (root + hicolor 256px).
          cp assets/brand/tinkerpro-icon-512.png "$APPDIR/support_desktop.png"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp assets/brand/tinkerpro-icon-512.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/support_desktop.png"

          # AppRun launcher.
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/support_desktop" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # appimagetool — extract-and-run so it works without FUSE on the runner.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          OUT="TinkerProSupport-${{ steps.ver.outputs.appVer }}-x86_64.AppImage"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" "$OUT"
          echo "Built $OUT"
          ls -lh "$OUT"
        shell: bash

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: support_desktop-linux-x64
          path: support_desktop/support_desktop-linux-x64-*.tar.gz
          retention-days: 14

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinkerProSupport-AppImage
          path: support_desktop/TinkerProSupport-*-x86_64.AppImage
          retention-days: 14
