name: Build desktop app (support_tauri)

# Tauri v2 desktop wrapper of https://support.tinkerpro.io — builds Windows and
# Linux installers.
#
# Triggers:
#   - manual via the Actions tab ("Run workflow")
#   - automatic on tags like tauri-v1.2.3 (namespaced so it doesn't collide
#     with the Flutter apps' sd-v* / v* / android-v* tag triggers)
on:
  workflow_dispatch:
  push:
    tags:
      - 'tauri-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 = older glibc → the .deb/AppImage run on a wider range of
          # distros than if we built on 24.04.
          - os: ubuntu-22.04
            label: linux
          - os: windows-2022
            label: windows

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: support_tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: support_tauri/src-tauri

      # Linux needs the WebKitGTK / GTK / rsvg / appindicator dev libraries to
      # compile the webview + bundle the AppImage. Windows uses the OS WebView2
      # runtime (present on the runner) and needs nothing extra.
      - name: Install Linux build deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file
        shell: bash

      - name: Install JS deps
        run: npm ci || npm install
        shell: bash

      - name: Build (Tauri)
        # NO_STRIP works around a spurious "Text file busy" from linuxdeploy at
        # the end of AppImage bundling; no effect on Windows.
        env:
          NO_STRIP: 'true'
        run: npx tauri build
        shell: bash

      - name: Collect Linux bundles
        if: matrix.label == 'linux'
        run: |
          mkdir -p dist
          cp -v src-tauri/target/release/bundle/deb/*.deb       dist/ 2>/dev/null || true
          cp -v src-tauri/target/release/bundle/rpm/*.rpm       dist/ 2>/dev/null || true
          cp -v src-tauri/target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          ls -lh dist
        shell: bash

      - name: Collect Windows bundles
        if: matrix.label == 'windows'
        run: |
          mkdir -p dist
          cp -v src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          cp -v src-tauri/target/release/bundle/msi/*.msi  dist/ 2>/dev/null || true
          ls -lh dist
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: support_tauri-${{ matrix.label }}
          path: support_tauri/dist/*
          retention-days: 14
