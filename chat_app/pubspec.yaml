name: tinkerpro_chat
description: "TinkerPro Chat — messaging and voice/video calls with the support team."
publish_to: 'none'
version: 2.0.4+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.2

  url_launcher: ^6.3.1

  shared_preferences: ^2.3.2

  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3

  flutter_local_notifications: ^18.0.1

  google_fonts: ^6.2.1

  web_socket_channel: ^3.0.0

  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  google_sign_in: ^6.2.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  geolocator: ^13.0.1

  flutter_webrtc: ^0.12.0
  permission_handler: ^11.3.1
  chat_bubble:
    path: packages/chat_bubble
  flutter_overlay_window: ^0.5.0

  flutter_callkit_incoming: ^2.5.0

  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/tinkerpro_chat_mark.png"
  remove_alpha_ios: true
  background_color_ios: "#0A254D"
  adaptive_icon_background: "#0A254D"
  adaptive_icon_foreground: "assets/brand/tinkerpro_chat_mark.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
