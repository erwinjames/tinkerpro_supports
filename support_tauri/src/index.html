<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinkerPro Support</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap { max-width: 420px; padding: 2rem; }
      h1 { font-weight: 600; margin: 0 0 .5rem; }
      p { color: #94a3b8; line-height: 1.5; }
      button {
        margin-top: 1rem;
        padding: .6rem 1.2rem;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>TinkerPro Support</h1>
      <p>Couldn't reach <b>support.tinkerpro.io</b>. Check your internet connection and try again.</p>
      <button onclick="location.href='https://support.tinkerpro.io'">Retry</button>
    </div>
  </body>
</html>
