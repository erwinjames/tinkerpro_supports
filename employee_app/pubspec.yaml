name: employee_app
description: "TinkerPro employee desktop client — text chat + voice/video calls to admin support, identified by store name."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP + cookie-aware session (PHPSESSID survives across launches so a
  # re-installed app still authenticates as the same store).
  http: ^1.2.0
  cookie_jar: ^4.0.8
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1

  # Persistent storage for store name + session.
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4

  # HMAC for the per-machine RustDesk permanent-password derivation.
  crypto: ^3.0.3

  # Soketi/Pusher protocol — direct WebSocket because pusher_channels_flutter
  # doesn't expose host/port for self-hosted instances.
  web_socket_channel: ^3.0.0

  # WebRTC for voice/video calls to admin (chat.signal-based).
  flutter_webrtc: ^0.12.0
  permission_handler: ^11.3.1

  # Foreground audio cues — incoming-call ringtone, outgoing ringback.
  audioplayers: ^6.1.0

  # File picker for attachments in chat.
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  cached_network_image: ^3.4.1

  # Desktop window control — used by HelpGuide → scoped chat to force
  # the "waiting for ticket acceptance" screen on top of the POS UI
  # and intercept the X button so the cashier can't accidentally
  # dismiss the screen while their ticket is still in the queue.
  window_manager: ^0.4.3

  # POS shop info read direct from MariaDB on the LAN — fully automatic,
  # no PHP shim required. Vendored fork of mysql_client (third_party/
  # mysql_client_patched/) that fixes the empty-password handshake bug
  # upstream has, so XAMPP / TinkerPro POS installs (which ship with
  # empty root password) authenticate cleanly. mysql_client's parser
  # doesn't have the "Got packets out of order" desync that plagues
  # mysql1 on MariaDB 10.4+, so we get auto-discovery + credential
  # check + database read with no deployment on the POS side.
  mysql_client_patched:
    path: third_party/mysql_client_patched

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    # Bundled RustDesk portable binaries — extracted to a writable dir
    # on first launch by lib/services/remote_access_service.dart, so the
    # employee never has to run a separate installer. ~105 MB combined.
    # If repo size is a concern, move these to git-lfs.
    - assets/rustdesk/
