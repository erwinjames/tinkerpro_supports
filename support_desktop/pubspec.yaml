name: support_desktop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.2

  shared_preferences: ^2.3.2

  google_fonts: ^6.2.1

  url_launcher: ^6.3.1

  web_socket_channel: ^3.0.0
  flutter_webrtc: ^0.12.0
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  appflowy_editor:
    git:
      url: https://github.com/AppFlowy-IO/appflowy-editor.git
      ref: 01eccc6ee36bd07698bd80915289fe7070478cd2
  html: ^0.15.6
  provider: ^6.1.2
  pasteboard: ^0.5.0
  desktop_drop: ^0.8.4
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  window_manager: ^0.5.1
  fl_chart: ^1.2.0
  flutter_secure_storage: ^10.3.4
  flutter_local_notifications: ^22.3.1
  printing: ^5.15.1
  pdf: ^3.13.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: SourceSansPro
      fonts:
        - asset: assets/fonts/SourceSansPro-Regular.ttf
        - asset: assets/fonts/SourceSansPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSansPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSansPro-Italic.ttf
          style: italic
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf

